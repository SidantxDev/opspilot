# Same stack on Postgres: the API and every worker share one database instead of one SQLite file.
#   docker compose -f compose.yaml -f compose.postgres.yaml up --build --scale worker=4
x-pg-env: &pg-env
  OPSPILOT_DB: postgresql://opspilot:opspilot@postgres:5432/opspilot

services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: opspilot, POSTGRES_PASSWORD: opspilot, POSTGRES_DB: opspilot}
    volumes: [opspilot-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opspilot"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    environment: *pg-env
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    environment: *pg-env

volumes:
  opspilot-pg:
