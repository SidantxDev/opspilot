  correct: [{action: set_env, params: {key: STRIPE_WEBHOOK_SECRET}}]
  cluster:
    logs: |
      INFO connecting with api_key sk_live_51Hxxxxxxxxxxxxxxxx
      password=hunter2 for user billing
      KeyError: 'STRIPE_WEBHOOK_SECRET'
    events: |
      Warning  BackOff  pod/billing-9e-uu  Back-off restarting failed container
    describe: |
      Name: billing
      Replicas: 2 desired | 2 total | 0 available
      Containers:
        billing:
          Image: shop/billing:v2.9.0
          State: Waiting (Reason: CrashLoopBackOff)
          Last State: Terminated (Reason: Error, Exit Code: 1)
