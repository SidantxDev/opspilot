[project]
name = "opspilot"
version = "0.1.0"
description = "Durable multi-agent incident responder for Kubernetes, with human approval and an eval harness"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
